<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#264b8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رحلة 90">
<title>رحلة الـ 90 يوماً</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#18213a;--mu:#68718d;--ln:#e0e4ef;--br:#264b8f;--bt:#fff;--bs:#e6ecfa;--ok:#15803d;--no:#b91c1c;--am:#c27c00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--cd:#161e33;--tx:#e9edf8;--mu:#97a1bd;--ln:#27314d;--br:#8fb4f5;--bt:#0e1424;--bs:#1d2a4a;--ok:#4ade80;--no:#f87171;--am:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--cd:#161e33;--tx:#e9edf8;--mu:#97a1bd;--ln:#27314d;--br:#8fb4f5;--bt:#0e1424;--bs:#1d2a4a;--ok:#4ade80;--no:#f87171;--am:#fbbf24;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:400 16px/1.6 'Cairo','Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif}
#app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.3}
.sub{margin:2px 0 0;color:var(--mu);font-size:.88rem}
.acts{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;padding:4px 12px;min-height:40px}
button:focus-visible,input:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.pri,.chip.on{background:var(--br);color:var(--bt);border-color:var(--br);font-weight:600}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:12px}
.setup{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=text]{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:4px 10px;min-height:40px}
#tk{flex:1;min-width:150px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{text-align:center;padding:12px 6px}
.st b{display:block;font-size:1.8rem;font-weight:800;line-height:1.2}
.st span{color:var(--mu);font-size:.8rem;line-height:1.3;display:block}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.map{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.map button{aspect-ratio:1;min-height:0;padding:0;border:0;border-radius:5px;background:var(--ln)}
.map .done{background:var(--ok)}.map .fail{background:var(--no)}
.map .p{background:transparent;box-shadow:inset 0 0 0 2px var(--am)}
.map .f{opacity:.4;cursor:default}
.map .now{outline:2px solid var(--tx);outline-offset:1px}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;color:var(--mu);font-size:.8rem}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--ln);margin-inline-end:5px;vertical-align:-1px}
.lg .done{background:var(--ok)}.lg .fail{background:var(--no)}.lg .p{background:transparent;box-shadow:inset 0 0 0 2px var(--am)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.flt .go{margin-inline-start:auto}
.tw{margin-top:12px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:clip}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:2;text-align:start;padding:10px 8px;background:var(--bs);color:var(--br);font-size:.9rem;white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--ln);vertical-align:middle}
td:first-child,th:first-child{border-inline-start:5px solid transparent}
tr.today td:first-child{border-inline-start-color:var(--am)}
tr.done td{background:color-mix(in srgb,var(--ok) 13%,var(--cd))}
tr.fail td{background:color-mix(in srgb,var(--no) 13%,var(--cd))}
tr{scroll-margin-top:12px}
.nm{font-weight:800;width:44px;color:var(--br)}
.dt{color:var(--mu);font-size:.85rem}
.tag{background:var(--am);color:var(--bt);font-size:.7rem;border-radius:6px;padding:1px 7px;margin-inline-start:6px;font-weight:600}
.yn{display:flex;gap:8px;justify-content:flex-end}
.yn button{width:46px;height:44px;padding:0;font-weight:800;font-size:1.15rem}
.y{color:var(--ok)}.x{color:var(--no)}
.y.on{background:var(--ok);border-color:var(--ok);color:var(--bt)}
.x.on{background:var(--no);border-color:var(--no);color:var(--bt)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.mo[hidden]{display:none}
.sheet{width:min(440px,100%);background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:18px}
.sheet h3{margin:0 0 6px}.sheet p{margin:0 0 10px;color:var(--mu)}
.sheet textarea{width:100%;height:170px;direction:ltr;font:12px/1.4 monospace;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px}
.mb{display:flex;gap:8px;margin-top:12px}
@media(max-width:520px){h1{font-size:1.4rem}.st b{font-size:1.5rem}.dt{font-size:.78rem}.yn button{width:42px}td,th{padding-inline:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="wrap">
<header class="top">
 <div><h1>رحلة الـ 90 يوماً</h1><p class="sub" id="range"></p></div>
 <div class="acts">
  <button id="th"></button>
  <button data-x="json">تصدير JSON</button>
  <button data-x="csv">تصدير CSV</button>
  <button id="rs">إعادة ضبط</button>
 </div>
</header>

<section class="card setup">
 <input type="text" id="tk" maxlength="60" placeholder="اكتب مهمتك هنا" aria-label="اسم المهمة">
 <label for="start">البداية</label>
 <input type="date" id="start">
 <button id="today" class="pri">ابدأ من اليوم</button>
</section>

<section class="stats">
 <div class="card st"><b id="s1"></b><span>الأيام المكتملة</span></div>
 <div class="card st"><b id="s2"></b><span>نسبة الإنجاز من 90 يوماً</span></div>
 <div class="card st"><b id="s3"></b><span>أيام الالتزام المتتالية</span></div>
</section>
<div class="bar"><i id="fill"></i></div>
<section class="card">
 <p class="sub" id="left" style="margin:0 0 10px;font-weight:600"></p>
 <div class="map" id="map"></div>
 <p class="lg"><span><i class="done"></i>صح</span><span><i class="fail"></i>خطأ</span><span><i class="p"></i>لم يُحدَّد</span><span><i></i>قادم</span></p>
</section>

<nav class="flt">
 <button class="chip" data-f="all">كل الأيام</button>
 <button class="chip" data-f="week" id="wk"></button>
 <button class="chip" data-f="done">المكتملة</button>
 <button class="go" id="gt">اذهب إلى اليوم</button>
</nav>

<div class="tw"><table>
 <thead><tr><th>#</th><th>اليوم</th><th>التاريخ</th><th id="tn"></th></tr></thead>
 <tbody id="tb"></tbody>
</table></div>
<p class="sub" style="text-align:center;margin-top:20px">يُحفظ تقدمك تلقائياً في هذا المتصفح. صدّر نسخة احتياطية من وقت لآخر.</p>
</div></div>

<div class="mo" id="mo" hidden>
 <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
  <h3 id="mt"></h3><p id="mp"></p>
  <textarea id="mx" readonly></textarea>
  <div class="mb"><button class="pri" id="ok"></button><button id="cx"></button></div>
 </div>
</div>

<script>
const KEY='tracker90.v2',N=90,$=s=>document.querySelector(s);
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({start:iso(new Date()),theme:'',task:'المهمة اليومية',m:{}});
let S=null,f='all';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.start){S=fresh();try{const o=JSON.parse(localStorage.getItem('tracker90.v1'));if(o&&o.start){S.start=o.start;S.theme=o.theme||''}}catch(e){}}
S.m=S.m||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const P=s=>s.split('-').map(Number);
const dayDate=i=>{const[y,m,d]=P(S.start);return new Date(y,m-1,d+i-1)};
const fmt=d=>d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
const todayIdx=()=>{const[y,m,d]=P(S.start),t=new Date();return Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(y,m-1,d))/864e5)+1};
const streak=ti=>{let i=Math.min(ti,N);if(i<1)return 0;if(i===ti&&S.m[i]!==1)i--;let c=0;while(i>=1&&S.m[i]===1){c++;i--}return c};
const weekRange=()=>{const t=Math.min(Math.max(todayIdx(),1),N),w=Math.floor((t-1)/7);return[w*7+1,Math.min(w*7+7,N),w+1]};

function row(n,ti){
 const d=dayDate(n),v=S.m[n]||0,s=v===1?'done':v===-1?'fail':'';
 return `<tr id="d${n}" class="${s}${n===ti?' today':''}"><td class="nm">${n}</td><td><b>${DAYS[d.getDay()]}</b>${n===ti?'<span class="tag">اليوم</span>':''}</td><td class="dt">${fmt(d)}</td><td><div class="yn"><button class="y${v===1?' on':''}" data-d="${n}" data-v="1" aria-pressed="${v===1}" aria-label="صح">✓</button><button class="x${v===-1?' on':''}" data-d="${n}" data-v="-1" aria-pressed="${v===-1}" aria-label="خطأ">✗</button></div></td></tr>`;
}
function stats(ti){
 let dn=0;for(let n=1;n<=N;n++)if(S.m[n]===1)dn++;
 const pct=Math.round(dn/N*100);
 $('#s1').textContent=dn+' / '+N;$('#s2').textContent=pct+'%';$('#s3').textContent=streak(ti);$('#fill').style.width=pct+'%';
 let m='';for(let n=1;n<=N;n++){const c=n>ti?'f':S.m[n]===1?'done':S.m[n]===-1?'fail':'p';m+=`<button class="${c}${n===ti?' now':''}" data-go="${n}" aria-label="اليوم ${n}" title="اليوم ${n}"></button>`}
 $('#map').innerHTML=m;
 $('#left').textContent=ti<1?'يبدأ التحدي بعد '+(1-ti)+' يوم':ti>=N?'انتهى التحدي، '+dn+' يوماً مكتملاً من '+N:'مضى '+ti+' من '+N+' يوماً، وتبقى '+(N-ti)+' يوماً';
}
function render(){
 const ti=todayIdx(),[lo,hi0]=f==='week'?weekRange():[1,N],hi=Math.min(hi0,ti);let h='';
 stats(ti);
 $('#range').textContent='من '+fmt(dayDate(1))+' إلى '+fmt(dayDate(N))+(ti<1?'، يبدأ بعد '+(1-ti)+' يوم':ti>N?'، انتهى التحدي':'، اليوم '+ti+' من '+N);
 $('#tn').textContent=S.task||'المهمة';
 $('#wk').textContent='الأسبوع الحالي ('+weekRange()[2]+')';
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));
 for(let n=lo;n<=hi;n++)if(f!=='done'||S.m[n]===1)h+=row(n,ti);
 $('#tb').innerHTML=h||'<tr><td colspan="4" class="empty">'+(ti<1?'لم يبدأ التحدي بعد. سيظهر أول يوم في '+fmt(dayDate(1))+'.':'لا توجد أيام مكتملة بعد. حدّد ✓ لتظهر هنا.')+'</td></tr>';
}
function go(n){let el=document.getElementById('d'+n);if(!el){f='all';render();el=document.getElementById('d'+n)}if(el)requestAnimationFrame(()=>el.scrollIntoView({block:'center'}))}
const goToday=()=>go(Math.min(Math.max(todayIdx(),1),N));

/* نافذة */
let cb=null;
function ask(o){$('#mt').textContent=o.title;$('#mp').textContent=o.text||'';$('#mx').hidden=!o.area;$('#mx').value=o.area||'';$('#ok').hidden=!o.fn;$('#ok').textContent=o.ok||'تأكيد';$('#cx').textContent=o.fn?'إلغاء':'إغلاق';cb=o.fn;$('#mo').hidden=false;if(o.area)$('#mx').select();else $('#cx').focus()}
const closeM=()=>{$('#mo').hidden=true;cb=null};
$('#ok').onclick=()=>{const fn=cb;closeM();fn&&fn()};
$('#cx').onclick=closeM;
$('#mo').addEventListener('click',e=>{if(e.target.id==='mo')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

/* تصدير */
function build(kind){
 if(kind==='json')return JSON.stringify({app:'tracker-90',exported:new Date().toISOString(),...S},null,2);
 const r=[['اليوم','اسم اليوم','التاريخ','المهمة','الحالة']];
 for(let n=1;n<=N;n++){const d=dayDate(n),v=S.m[n]||0;r.push([n,DAYS[d.getDay()],iso(d),S.task,v>0?'صح':v<0?'خطأ':'لم تُحدَّد'])}
 return '\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
async function exp(kind){
 const data=build(kind),name='tracker-90-'+S.start+'.'+kind;
 let dl=null;try{dl=await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data});return}catch(e){if(e&&e.code==='declined')return}}
 if(typeof claude==='undefined'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();return}catch(e){}}
 ask({title:'نسخة احتياطية ('+kind.toUpperCase()+')',text:'انسخ المحتوى واحفظه في ملف باسم '+name,area:data});
}

/* الثيم */
const dark=()=>S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){const r=document.documentElement;S.theme?r.dataset.theme=S.theme:delete r.dataset.theme;$('#th').textContent=dark()?'☀️ نهاري':'🌙 ليلي'}
$('#th').onclick=()=>{S.theme=dark()?'light':'dark';applyTheme();save()};

/* الأحداث */
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.f){f=b.dataset.f;return render()}
 if(b.dataset.go){const g=+b.dataset.go;if(g<=todayIdx())go(g);return}
 if(b.dataset.x)return exp(b.dataset.x);
 if(b.dataset.d){
  const n=+b.dataset.d,v=+b.dataset.v;
  S.m[n]===v?delete S.m[n]:S.m[n]=v;save();
  if(f==='done')render();else{const ti=todayIdx(),tr=document.getElementById('d'+n);if(tr)tr.outerHTML=row(n,ti);stats(ti)}
 }
});
$('#tk').value=S.task;
$('#tk').onchange=e=>{S.task=e.target.value.trim()||'المهمة اليومية';e.target.value=S.task;save();$('#tn').textContent=S.task};
$('#start').onchange=e=>{if(e.target.value){S.start=e.target.value;save();render()}};
$('#today').onclick=()=>{S.start=iso(new Date());$('#start').value=S.start;save();render();goToday()};
$('#gt').onclick=goToday;
$('#rs').onclick=()=>ask({title:'إعادة الضبط',text:'سيُحذف كل التقدم ويعود التاريخ إلى اليوم. لا يمكن التراجع.',ok:'نعم، أعد الضبط',fn:()=>{const th=S.theme;S=fresh();S.theme=th;$('#tk').value=S.task;$('#start').value=S.start;save();render()}});

applyTheme();$('#start').value=S.start;render();save();
let lastTi=todayIdx();setInterval(()=>{const t=todayIdx();if(t!==lastTi){lastTi=t;render()}},30000);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{const t=todayIdx();if(t>1&&t<=N)goToday()});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
